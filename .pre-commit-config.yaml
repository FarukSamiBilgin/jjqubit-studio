# Pre-commit hooks for JJQubit Studio.
#
# Install once per clone:
#     pip install -r requirements-dev.txt
#     pre-commit install
#
# Then ruff (lint + format) and mypy (on core/) run automatically before each
# commit, matching what CI enforces so problems are caught locally first.

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.4
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: check-merge-conflict

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        files: ^core/
        additional_dependencies: [numpy==2.2.5]
