# JJQubit Studio -- tooling configuration.
#
# This file intentionally carries NO [build-system]/[project] table: the app
# is run from a source checkout (`python -m gui.app`) and packaged with
# PyInstaller, and the test suite imports `core.*` / `gui.*` as top-level
# packages from the repo root (see the per-suite conftest.py files). Declaring
# a build backend here would change that flat import layout, so we keep this
# file to tool configuration only.
#
# A real installable `jjqubit` package (scriptable API) is introduced
# separately without disturbing this layout.

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
# Quiet, no cache dir noise in CI. Individual conftest.py files already force
# QT_QPA_PLATFORM=offscreen so GUI tests run headless.
addopts = "-q -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 88
# core/ and gui/ are the first-party source trees; tests and scripts too.
src = ["core", "gui", "tests", "scripts"]
extend-exclude = [".venv", "build", "dist", "*.spec"]

[tool.ruff.lint]
# A pragmatic starting set: pyflakes (F), pycodestyle (E/W), isort (I),
# pyupgrade (UP), flake8-bugbear (B), comprehensions (C4).
# Deliberately NOT enabling the whole catalogue on day one -- the point is a
# signal that stays green, then tightening. Expand as the codebase adapts.
#
# pep8-naming (N) is intentionally OMITTED: this is a physics codebase where
# domain notation (Ej, Ec, Ic, Cj, E01, S21, chi, T1/T2) is the correct,
# standard spelling. Forcing snake_case there would hurt readability and
# fight the field's conventions (CLAUDE.md: units/notation clarity matters).
select = ["F", "E", "W", "I", "UP", "B", "C4"]
ignore = [
    "E501",  # line length is handled by the formatter, not the linter
]

[tool.ruff.lint.per-file-ignores]
# Tests may use fixtures/asserts freely; __init__ re-exports are intentional.
"tests/**" = ["B011"]
"**/__init__.py" = ["F401"]
# conftest.py files must insert the repo root into sys.path BEFORE importing
# first-party packages, so module-level imports legitimately follow code.
"**/conftest.py" = ["E402"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.11"
# The source tree mixes a regular package (core/netlist/ has __init__.py) with
# implicit namespace packages (core/, core/solvers/ do not). That is fine at
# runtime (repo root on sys.path) but mypy needs to be told to treat the repo
# root as the import base, or it sees the same file under two module names.
mypy_path = "."
explicit_package_bases = true
namespace_packages = true
# Start lenient: this is a 12k-line codebase with no prior type checking.
# The goal is to introduce mypy as a NON-blocking signal, then ratchet
# strictness up on core/ (the physics + netlist contract) first, because that
# is where a units/shape mistake is most dangerous (CLAUDE.md physics rule).
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = false
ignore_missing_imports = true
check_untyped_defs = false
disallow_untyped_defs = false
exclude = ['^build/', '^dist/', '^\.venv/']

# Third-party scientific stack ships incomplete or no type stubs; don't let
# that noise drown out real findings in our own code.
[[tool.mypy.overrides]]
module = [
    "scqubits.*",
    "qutip.*",
    "h5py.*",
    "pyqtgraph.*",
    "matplotlib.*",
    "scipy.*",
]
ignore_missing_imports = true
